<h2>Administración de eventos</h2>
<form id="admin-acceso" autocomplete="off">
  <label>Clave de administrador
    <span class="clave-wrap">
      <input type="password" name="clave" required autocomplete="off">
      <button type="button" class="ojo" aria-label="Mostrar clave" title="Mostrar clave">👁</button>
    </span>
  </label>
  <button type="submit" class="btn">Ingresar</button>
  <p class="msg" role="alert"></p>
</form>
<div id="admin-panel" hidden></div>
