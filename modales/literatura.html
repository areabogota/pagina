<h2>Pedido de literatura</h2>
<form id="pedido-form">
  <label>Teléfono
    <input type="tel" name="telefono" required maxlength="20" inputmode="tel" autocomplete="tel" placeholder="Ej. 3001234567">
  </label>
  <input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
  <button type="submit" class="btn">Enviar pedido</button>
  <div class="msg" role="status"></div>
</form>
