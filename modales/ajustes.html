<h2>Ajustes del grupo</h2>
<p id="ajustes-cuenta"></p>
<form id="ajustes-acceso" autocomplete="off">
  <label>Grupo
    <select name="grupo" required><option value="">Cargando grupos…</option></select>
  </label>
  <label>Clave
    <span class="clave-wrap">
      <input type="password" name="clave" required autocomplete="off">
      <button type="button" class="ojo" aria-label="Mostrar clave" title="Mostrar clave">👁</button>
    </span>
  </label>
  <button type="submit" class="btn">Ingresar</button>
  <p class="msg" role="alert"></p>
</form>
<div id="ajustes-panel" hidden>
  <h3 id="ajustes-grupo"></h3>
  <p>Aquí irán los ajustes de tu grupo (próximamente).</p>
</div>
