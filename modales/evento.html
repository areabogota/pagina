<h2>Agregar evento</h2>
<form id="evento-acceso" autocomplete="off">
  <label>Grupo
    <select name="grupo" required><option value="">Cargando grupos…</option></select>
  </label>
  <label>Clave
    <span class="clave-wrap">
      <input type="password" name="clave" required autocomplete="off">
      <button type="button" class="ojo" aria-label="Mostrar clave" title="Mostrar clave"><svg class="ico" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12Z"/><circle cx="12" cy="12" r="3"/></svg></button>
    </span>
  </label>
  <button type="submit" class="btn">Ingresar</button>
  <p class="msg" role="alert"></p>
</form>
<div id="evento-panel" hidden></div>
