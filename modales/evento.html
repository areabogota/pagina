<h2>Agregar evento</h2>
<form id="evento-acceso" autocomplete="off">
  <label>Grupo
    <select name="grupo" required><option value="">Cargando grupos…</option></select>
  </label>
  <label>Clave
    <span class="clave-wrap">
      <input type="password" name="clave" required autocomplete="off">
      <button type="button" class="ojo" aria-label="Mostrar clave" title="Mostrar clave">👁</button>
    </span>
  </label>
  <button type="submit" class="btn">Ingresar</button>
  <p class="msg" role="alert"></p>
</form>
<div id="evento-panel" hidden></div>
